<!DOCTYPE html>
<html>

<head>

    <title>Medicine Reminder Dashboard</title>

    <link rel="stylesheet" href="/style.css">

    <style>

        .taken-area {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            margin-right: 10px;
        }

        .taken-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #888;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .taken-checkbox.checked {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }

        .taken-label {
            color: #333;
        }

        .taken-label.checked {
            color: #16a34a;
            font-weight: bold;
        }

        /* ================= REMINDER ================= */

        .reminder-box {
            display: none;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #664d03;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>💊 Medicine Reminder</h1>

    <h2>Manage Your Medicines</h2>


    <!-- ================= REMINDER BOX ================= -->

    <div id="reminderBox" class="reminder-box"></div>


    <!-- ================= MEDICINE FORM ================= -->

    <form id="medicineForm">

        <label>Medicine Name</label>

        <input
            type="text"
            name="medicineName"
            placeholder="Enter medicine name"
            required
        >


        <label>Reminder Time</label>

        <input
            type="time"
            name="medicineTime"
            required
        >


        <label>Start Date</label>

        <input
            type="date"
            name="startDate"
            required
        >


        <label>End Date</label>

        <input
            type="date"
            name="endDate"
            required
        >


        <button
            type="submit"
            id="submitButton">

            + Add Medicine

        </button>

    </form>


    <hr>


    <!-- ================= MEDICINE LIST ================= -->

    <h3>Your Medicines</h3>

    <div id="medicineList"></div>


    <!-- ================= LOGOUT ================= -->

    <form id="logoutForm" action="/logout" method="POST">
        <button class="logout-btn" type="submit">
            Logout
        </button>
    </form>

</div>



<script>


// ======================================================
// GLOBAL VARIABLES
// ======================================================

let editingMedicineId = null;


// This remembers which medicines already showed
// a reminder during the current dashboard session.

let remindersShown = new Set();
let csrfToken = null;

async function getCsrfToken() {
    if (csrfToken) {
        return csrfToken;
    }

    const response = await fetch("/csrf-token");
    if (!response.ok) {
        throw new Error("Unable to prepare a secure request.");
    }

    const result = await response.json();
    if (typeof result.csrfToken !== "string") {
        throw new Error("Unable to prepare a secure request.");
    }

    csrfToken = result.csrfToken;
    return csrfToken;
}


// ======================================================
// GET TODAY'S DATE
// ======================================================

function getTodayDate() {

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


// ======================================================
// LOAD MEDICINES
// ======================================================

async function loadMedicines() {

    try {

        const response =
            await fetch("/getMedicines");


        if (!response.ok) {

            throw new Error(
                "Failed to load medicines"
            );

        }


        const medicines =
            await response.json();


        const list =
            document.getElementById(
                "medicineList"
            );


        list.replaceChildren();


        // No medicines

        if (medicines.length === 0) {
            const emptyMessage = document.createElement("p");
            emptyMessage.textContent = "No medicines added yet.";
            list.appendChild(emptyMessage);

            return;

        }


        medicines.forEach(
            (medicine) => {


                // ==================================================
                // DAILY TAKEN CHECK
                // ==================================================

                const today =
                    getTodayDate();


                const isTakenToday =
                    medicine.taken &&
                    medicine.lastTakenDate === today;


                // ==================================================
                // TIME FORMAT
                // ==================================================

                const [rawHour = "", minute = ""] = String(medicine.medicineTime || "").split(":");
                let hour = Number.parseInt(rawHour, 10);
                let period = hour >= 12 ? "PM" : "AM";
                if (hour > 12) hour -= 12;
                if (hour === 0) hour = 12;
                const formattedTime = Number.isNaN(hour) ? "Time unavailable" : `${hour}:${minute} ${period}`;

                const card = document.createElement("div");
                card.className = "medicine-card";

                const info = document.createElement("div");
                info.className = "medicine-info";

                const name = document.createElement("h4");
                name.textContent = `💊 ${medicine.medicineName ?? ""}`;
                info.appendChild(name);

                const time = document.createElement("p");
                time.textContent = `🕒 ${formattedTime}`;
                info.appendChild(time);

                const dates = document.createElement("p");
                dates.textContent = `📅 ${medicine.startDate ?? ""} → ${medicine.endDate ?? ""}`;
                info.appendChild(dates);
                card.appendChild(info);

                const actions = document.createElement("div");
                actions.className = "action-buttons";

                const takenArea = document.createElement("div");
                takenArea.className = "taken-area";
                takenArea.setAttribute("role", "button");
                takenArea.tabIndex = 0;

                const checkbox = document.createElement("div");
                checkbox.className = isTakenToday ? "taken-checkbox checked" : "taken-checkbox";
                checkbox.textContent = isTakenToday ? "✓" : "";
                takenArea.appendChild(checkbox);

                const takenLabel = document.createElement("span");
                takenLabel.className = isTakenToday ? "taken-label checked" : "taken-label";
                takenLabel.textContent = isTakenToday ? "Taken" : "Mark taken";
                takenArea.appendChild(takenLabel);
                takenArea.addEventListener("click", () => takeMedicine(medicine._id));
                takenArea.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        takeMedicine(medicine._id);
                    }
                });
                actions.appendChild(takenArea);

                const editButton = document.createElement("button");
                editButton.type = "button";
                editButton.className = "edit-btn";
                editButton.textContent = "Edit";
                editButton.addEventListener("click", () => editMedicine(
                    medicine._id,
                    medicine.medicineName,
                    medicine.medicineTime,
                    medicine.startDate,
                    medicine.endDate
                ));
                actions.appendChild(editButton);

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete";
                deleteButton.addEventListener("click", () => deleteMedicine(medicine._id));
                actions.appendChild(deleteButton);

                card.appendChild(actions);
                list.appendChild(card);

            }
        );


    } catch (error) {

        console.log(
            "Error loading medicines:",
            error
        );

    }

}


// ======================================================
// CHECK REMINDERS
// ======================================================

async function checkReminders() {

    try {

        const response =
            await fetch("/getMedicines");


        if (!response.ok) {

            return;

        }


        const medicines =
            await response.json();


        const now =
            new Date();


        const today =
            getTodayDate();


        const currentHour =
            now.getHours();


        const currentMinute =
            now.getMinutes();


        const currentMinutes =
            currentHour * 60 +
            currentMinute;


        medicines.forEach(
            (medicine) => {


                // ==================================================
                // CHECK MEDICINE DATE RANGE
                // ==================================================

                if (
                    today < medicine.startDate ||
                    today > medicine.endDate
                ) {

                    return;

                }


                // ==================================================
                // CHECK IF ALREADY TAKEN TODAY
                // ==================================================

                if (
                    medicine.taken &&
                    medicine.lastTakenDate === today
                ) {

                    return;

                }


                // ==================================================
                // MEDICINE TIME
                // ==================================================

                const [
                    medicineHour,
                    medicineMinute
                ] =
                    medicine.medicineTime
                        .split(":")
                        .map(Number);


                const scheduledMinutes =
                    medicineHour * 60 +
                    medicineMinute;


                // ==================================================
                // CHECK WHETHER TIME HAS ARRIVED
                // ==================================================

                if (
                    currentMinutes >=
                    scheduledMinutes
                ) {


                    // ==================================================
                    // PREVENT REPEATED POPUPS
                    // ==================================================

                    const reminderId =
                        medicine._id +
                        "-" +
                        today;


                    if (
                        remindersShown.has(
                            reminderId
                        )
                    ) {

                        return;

                    }


                    remindersShown.add(
                        reminderId
                    );


                    // ==================================================
                    // SHOW REMINDER
                    // ==================================================

                    alert(
                        "💊 Medicine Reminder!\n\n" +
                        "It is time to take " +
                        medicine.medicineName +
                        "."
                    );

                }

            }
        );


    } catch (error) {

        console.log(
            "Reminder error:",
            error
        );

    }

}


// ======================================================
// EDIT MEDICINE
// ======================================================

function editMedicine(
    id,
    name,
    time,
    startDate,
    endDate
) {

    editingMedicineId = id;


    document.querySelector(
        'input[name="medicineName"]'
    ).value = name;


    document.querySelector(
        'input[name="medicineTime"]'
    ).value = time;


    document.querySelector(
        'input[name="startDate"]'
    ).value = startDate;


    document.querySelector(
        'input[name="endDate"]'
    ).value = endDate;


    document.getElementById(
        "submitButton"
    ).innerText =
        "Update Medicine";

}


// ======================================================
// DELETE MEDICINE
// ======================================================

async function deleteMedicine(id) {

    if (
        !confirm(
            "Delete this medicine?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                "/deleteMedicine/" + id,
                {
                    method: "DELETE",
                    headers: {
                        "X-CSRF-Token": await getCsrfToken()
                    }
                }
            );


        if (response.ok) {

            loadMedicines();

        } else {

            alert(
                "Failed to delete medicine."
            );

        }

    } catch (error) {

        console.log(error);

        alert(
            "Failed to delete medicine."
        );

    }

}


// ======================================================
// MARK MEDICINE AS TAKEN
// ======================================================

async function takeMedicine(id) {

    try {

        const response =
            await fetch(
                "/takeMedicine/" + id,
                {
                    method: "PUT",
                    headers: {
                        "X-CSRF-Token": await getCsrfToken()
                    }
                }
            );


        if (response.ok) {

            loadMedicines();

        } else {

            alert(
                "Failed to mark medicine as taken."
            );

        }

    } catch (error) {

        console.log(error);

        alert(
            "Failed to mark medicine as taken."
        );

    }

}


// ======================================================
// ADD / UPDATE MEDICINE
// ======================================================

document.getElementById(
    "medicineForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // ==================================================
        // GET FORM VALUES
        // ==================================================

        const medicineName =
            document.querySelector(
                'input[name="medicineName"]'
            ).value;


        const medicineTime =
            document.querySelector(
                'input[name="medicineTime"]'
            ).value;


        const startDate =
            document.querySelector(
                'input[name="startDate"]'
            ).value;


        const endDate =
            document.querySelector(
                'input[name="endDate"]'
            ).value;


        // ==================================================
        // UPDATE EXISTING MEDICINE
        // ==================================================

        if (editingMedicineId) {

            try {

                const response =
                    await fetch(
                        "/updateMedicine/" +
                        editingMedicineId,
                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",
                                "X-CSRF-Token":
                                    await getCsrfToken()

                            },

                            body:
                                JSON.stringify({

                                    medicineName:
                                        medicineName,

                                    medicineTime:
                                        medicineTime,

                                    startDate:
                                        startDate,

                                    endDate:
                                        endDate

                                })

                        }
                    );


                if (response.ok) {

                    alert(
                        "Medicine Updated Successfully!"
                    );


                    editingMedicineId =
                        null;


                    document.getElementById(
                        "submitButton"
                    ).innerText =
                        "+ Add Medicine";


                    document.getElementById(
                        "medicineForm"
                    ).reset();


                    loadMedicines();

                } else {

                    alert(
                        "Failed to update medicine."
                    );

                }


            } catch (error) {

                console.log(error);

                alert(
                    "Failed to update medicine."
                );

            }


        }


        // ==================================================
        // ADD NEW MEDICINE
        // ==================================================

        else {

            try {

                const response =
                    await fetch(
                        "/addMedicine",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/x-www-form-urlencoded",
                                "X-CSRF-Token":
                                    await getCsrfToken()

                            },

                            body:
                                new URLSearchParams({

                                    medicineName:
                                        medicineName,

                                    medicineTime:
                                        medicineTime,

                                    startDate:
                                        startDate,

                                    endDate:
                                        endDate

                                })

                        }
                    );


                if (response.ok) {

                    document.getElementById(
                        "medicineForm"
                    ).reset();


                    loadMedicines();

                } else {

                    alert(
                        "Failed to add medicine."
                    );

                }


            } catch (error) {

                console.log(error);

                alert(
                    "Failed to add medicine."
                );

            }

        }

    }
);


// ======================================================
// INITIAL LOAD
// ======================================================

document.getElementById("logoutForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    try {
        const response = await fetch("/logout", {
            method: "POST",
            headers: {
                "X-CSRF-Token": await getCsrfToken()
            }
        });

        if (!response.ok) {
            throw new Error("Logout failed.");
        }

        window.location.href = "/login";
    } catch (error) {
        alert("Unable to log out. Please try again.");
    }
});

loadMedicines();


// ======================================================
// CHECK REMINDERS IMMEDIATELY
// ======================================================

checkReminders();


// ======================================================
// CHECK REMINDERS EVERY 30 SECONDS
// ======================================================

setInterval(
    checkReminders,
    30000
);


</script>


</body>

</html>
