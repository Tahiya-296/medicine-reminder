<!DOCTYPE html>
<html>

<head>

    <title>Medicine Reminder Dashboard</title>

    <link rel="stylesheet" href="/style.css">

    <style>

        .taken-area {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            margin-right: 10px;
        }

        .taken-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #888;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .taken-checkbox.checked {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }

        .taken-label {
            color: #333;
        }

        .taken-label.checked {
            color: #16a34a;
            font-weight: bold;
        }

        /* ================= REMINDER ================= */

        .reminder-box {
            display: none;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #664d03;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>💊 Medicine Reminder</h1>

    <h2>Manage Your Medicines</h2>


    <!-- ================= REMINDER BOX ================= -->

    <div id="reminderBox" class="reminder-box"></div>


    <!-- ================= MEDICINE FORM ================= -->

    <form id="medicineForm">

        <label>Medicine Name</label>

        <input
            type="text"
            name="medicineName"
            placeholder="Enter medicine name"
            required
        >


        <label>Reminder Time</label>

        <input
            type="time"
            name="medicineTime"
            required
        >


        <label>Start Date</label>

        <input
            type="date"
            name="startDate"
            required
        >


        <label>End Date</label>

        <input
            type="date"
            name="endDate"
            required
        >


        <button
            type="submit"
            id="submitButton">

            + Add Medicine

        </button>

    </form>


    <hr>


    <!-- ================= MEDICINE LIST ================= -->

    <h3>Your Medicines</h3>

    <div id="medicineList"></div>


    <!-- ================= LOGOUT ================= -->

    <button
        class="logout-btn"
        onclick="window.location.href='/login'">

        Logout

    </button>

</div>



<script>


// ======================================================
// GLOBAL VARIABLES
// ======================================================

let editingMedicineId = null;


// This remembers which medicines already showed
// a reminder during the current dashboard session.

let remindersShown = new Set();


// ======================================================
// GET TODAY'S DATE
// ======================================================

function getTodayDate() {

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


// ======================================================
// LOAD MEDICINES
// ======================================================

async function loadMedicines() {

    try {

        const response =
            await fetch("/getMedicines");


        if (!response.ok) {

            throw new Error(
                "Failed to load medicines"
            );

        }


        const medicines =
            await response.json();


        const list =
            document.getElementById(
                "medicineList"
            );


        list.innerHTML = "";


        // No medicines

        if (medicines.length === 0) {

            list.innerHTML = `
                <p>
                    No medicines added yet.
                </p>
            `;

            return;

        }


        medicines.forEach(
            (medicine) => {


                // ==================================================
                // DAILY TAKEN CHECK
                // ==================================================

                const today =
                    getTodayDate();


                const isTakenToday =
                    medicine.taken &&
                    medicine.lastTakenDate === today;


                // ==================================================
                // TIME FORMAT
                // ==================================================

                let time =
                    medicine.medicineTime;


                let [
                    hour,
                    minute
                ] =
                    time.split(":");


                hour =
                    parseInt(hour);


                let period = "AM";


                if (hour >= 12) {

                    period = "PM";

                }


                if (hour > 12) {

                    hour -= 12;

                }


                if (hour === 0) {

                    hour = 12;

                }


                const formattedTime =
                    `${hour}:${minute} ${period}`;


                // ==================================================
                // TAKEN CHECKBOX
                // ==================================================

                let takenHTML;


                if (isTakenToday) {

                    takenHTML = `

                        <div
                            class="taken-area"
                            onclick="takeMedicine('${medicine._id}')">

                            <div
                                class="taken-checkbox checked">

                                ✓

                            </div>

                            <span
                                class="taken-label checked">

                                Taken

                            </span>

                        </div>

                    `;

                } else {

                    takenHTML = `

                        <div
                            class="taken-area"
                            onclick="takeMedicine('${medicine._id}')">

                            <div
                                class="taken-checkbox">
                            </div>

                            <span
                                class="taken-label">

                                Taken

                            </span>

                        </div>

                    `;

                }


                // ==================================================
                // MEDICINE CARD
                // ==================================================

                list.innerHTML += `

                    <div class="medicine-card">

                        <div class="medicine-info">

                            <h4>
                                💊 ${medicine.medicineName}
                            </h4>

                            <p>
                                🕒 ${formattedTime}
                            </p>

                            <p>
                                📅 ${medicine.startDate}
                                → ${medicine.endDate}
                            </p>

                        </div>


                        <div class="action-buttons">

                            ${takenHTML}


                            <button
                                type="button"
                                class="edit-btn"
                                onclick="editMedicine(
                                    '${medicine._id}',
                                    '${medicine.medicineName}',
                                    '${medicine.medicineTime}',
                                    '${medicine.startDate}',
                                    '${medicine.endDate}'
                                )">

                                Edit

                            </button>


                            <button
                                type="button"
                                class="delete-btn"
                                onclick="deleteMedicine(
                                    '${medicine._id}'
                                )">

                                Delete

                            </button>

                        </div>

                    </div>

                `;

            }
        );


    } catch (error) {

        console.log(
            "Error loading medicines:",
            error
        );

    }

}


// ======================================================
// CHECK REMINDERS
// ======================================================

async function checkReminders() {

    try {

        const response =
            await fetch("/getMedicines");


        if (!response.ok) {

            return;

        }


        const medicines =
            await response.json();


        const now =
            new Date();


        const today =
            getTodayDate();


        const currentHour =
            now.getHours();


        const currentMinute =
            now.getMinutes();


        const currentMinutes =
            currentHour * 60 +
            currentMinute;


        medicines.forEach(
            (medicine) => {


                // ==================================================
                // CHECK MEDICINE DATE RANGE
                // ==================================================

                if (
                    today < medicine.startDate ||
                    today > medicine.endDate
                ) {

                    return;

                }


                // ==================================================
                // CHECK IF ALREADY TAKEN TODAY
                // ==================================================

                if (
                    medicine.taken &&
                    medicine.lastTakenDate === today
                ) {

                    return;

                }


                // ==================================================
                // MEDICINE TIME
                // ==================================================

                const [
                    medicineHour,
                    medicineMinute
                ] =
                    medicine.medicineTime
                        .split(":")
                        .map(Number);


                const scheduledMinutes =
                    medicineHour * 60 +
                    medicineMinute;


                // ==================================================
                // CHECK WHETHER TIME HAS ARRIVED
                // ==================================================

                if (
                    currentMinutes >=
                    scheduledMinutes
                ) {


                    // ==================================================
                    // PREVENT REPEATED POPUPS
                    // ==================================================

                    const reminderId =
                        medicine._id +
                        "-" +
                        today;


                    if (
                        remindersShown.has(
                            reminderId
                        )
                    ) {

                        return;

                    }


                    remindersShown.add(
                        reminderId
                    );


                    // ==================================================
                    // SHOW REMINDER
                    // ==================================================

                    alert(
                        "💊 Medicine Reminder!\n\n" +
                        "It is time to take " +
                        medicine.medicineName +
                        "."
                    );

                }

            }
        );


    } catch (error) {

        console.log(
            "Reminder error:",
            error
        );

    }

}


// ======================================================
// EDIT MEDICINE
// ======================================================

function editMedicine(
    id,
    name,
    time,
    startDate,
    endDate
) {

    editingMedicineId = id;


    document.querySelector(
        'input[name="medicineName"]'
    ).value = name;


    document.querySelector(
        'input[name="medicineTime"]'
    ).value = time;


    document.querySelector(
        'input[name="startDate"]'
    ).value = startDate;


    document.querySelector(
        'input[name="endDate"]'
    ).value = endDate;


    document.getElementById(
        "submitButton"
    ).innerText =
        "Update Medicine";

}


// ======================================================
// DELETE MEDICINE
// ======================================================

async function deleteMedicine(id) {

    if (
        !confirm(
            "Delete this medicine?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                "/deleteMedicine/" + id,
                {
                    method: "DELETE"
                }
            );


        if (response.ok) {

            loadMedicines();

        } else {

            alert(
                "Failed to delete medicine."
            );

        }

    } catch (error) {

        console.log(error);

        alert(
            "Failed to delete medicine."
        );

    }

}


// ======================================================
// MARK MEDICINE AS TAKEN
// ======================================================

async function takeMedicine(id) {

    try {

        const response =
            await fetch(
                "/takeMedicine/" + id,
                {
                    method: "PUT"
                }
            );


        if (response.ok) {

            loadMedicines();

        } else {

            alert(
                "Failed to mark medicine as taken."
            );

        }

    } catch (error) {

        console.log(error);

        alert(
            "Failed to mark medicine as taken."
        );

    }

}


// ======================================================
// ADD / UPDATE MEDICINE
// ======================================================

document.getElementById(
    "medicineForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // ==================================================
        // GET FORM VALUES
        // ==================================================

        const medicineName =
            document.querySelector(
                'input[name="medicineName"]'
            ).value;


        const medicineTime =
            document.querySelector(
                'input[name="medicineTime"]'
            ).value;


        const startDate =
            document.querySelector(
                'input[name="startDate"]'
            ).value;


        const endDate =
            document.querySelector(
                'input[name="endDate"]'
            ).value;


        // ==================================================
        // UPDATE EXISTING MEDICINE
        // ==================================================

        if (editingMedicineId) {

            try {

                const response =
                    await fetch(
                        "/updateMedicine/" +
                        editingMedicineId,
                        {

                            method: "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    medicineName:
                                        medicineName,

                                    medicineTime:
                                        medicineTime,

                                    startDate:
                                        startDate,

                                    endDate:
                                        endDate

                                })

                        }
                    );


                if (response.ok) {

                    alert(
                        "Medicine Updated Successfully!"
                    );


                    editingMedicineId =
                        null;


                    document.getElementById(
                        "submitButton"
                    ).innerText =
                        "+ Add Medicine";


                    document.getElementById(
                        "medicineForm"
                    ).reset();


                    loadMedicines();

                } else {

                    alert(
                        "Failed to update medicine."
                    );

                }


            } catch (error) {

                console.log(error);

                alert(
                    "Failed to update medicine."
                );

            }


        }


        // ==================================================
        // ADD NEW MEDICINE
        // ==================================================

        else {

            try {

                const response =
                    await fetch(
                        "/addMedicine",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/x-www-form-urlencoded"

                            },

                            body:
                                new URLSearchParams({

                                    medicineName:
                                        medicineName,

                                    medicineTime:
                                        medicineTime,

                                    startDate:
                                        startDate,

                                    endDate:
                                        endDate

                                })

                        }
                    );


                if (response.ok) {

                    document.getElementById(
                        "medicineForm"
                    ).reset();


                    loadMedicines();

                } else {

                    alert(
                        "Failed to add medicine."
                    );

                }


            } catch (error) {

                console.log(error);

                alert(
                    "Failed to add medicine."
                );

            }

        }

    }
);


// ======================================================
// INITIAL LOAD
// ======================================================

loadMedicines();


// ======================================================
// CHECK REMINDERS IMMEDIATELY
// ======================================================

checkReminders();


// ======================================================
// CHECK REMINDERS EVERY 30 SECONDS
// ======================================================

setInterval(
    checkReminders,
    30000
);


</script>


</body>

</html>
