<!DOCTYPE html>
<html>

<head>

    <title>Medicine Reminder Dashboard</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="container">

    <h1>💊 Medicine Reminder</h1>

    <h2>Manage Your Medicines</h2>

    <form id="medicineForm">

        <label>Medicine Name</label>

        <input
            type="text"
            name="medicineName"
            placeholder="Enter medicine name"
            required
        >

        <label>Reminder Time</label>

        <input
            type="time"
            name="medicineTime"
            required
        >

        <button type="submit" id="submitButton">
            + Add Medicine
        </button>

    </form>

    <hr>

    <h3>Your Medicines</h3>

    <div id="medicineList"></div>

    <button
        class="logout-btn"
        onclick="window.location.href='/login'">

        Logout

    </button>

</div>


<script>

let editingMedicineId = null;


// ================= LOAD MEDICINES =================

async function loadMedicines() {

    const response = await fetch("/getMedicines");

    const medicines = await response.json();

    const list = document.getElementById("medicineList");

    list.innerHTML = "";

    medicines.forEach((medicine) => {

        let time = medicine.medicineTime;

        let [hour, minute] = time.split(":");

        hour = parseInt(hour);

        let period = "AM";

        if (hour >= 12) {
            period = "PM";
        }

        if (hour > 12) {
            hour -= 12;
        }

        if (hour === 0) {
            hour = 12;
        }

        const formattedTime = `${hour}:${minute} ${period}`;


        list.innerHTML += `

            <div class="medicine-card">

                <div class="medicine-info">

                    <h4>💊 ${medicine.medicineName}</h4>

                    <p>🕒 ${formattedTime}</p>

                </div>


                <div class="action-buttons">

                    <button
                        type="button"
                        class="edit-btn"
                        onclick="editMedicine(
                            '${medicine._id}',
                            '${medicine.medicineName}',
                            '${medicine.medicineTime}'
                        )">

                        Edit

                    </button>


                    <button
                        type="button"
                        class="delete-btn"
                        onclick="deleteMedicine('${medicine._id}')">

                        Delete

                    </button>

                </div>

            </div>

        `;

    });

}


// ================= EDIT MEDICINE =================

function editMedicine(id, name, time) {

    editingMedicineId = id;

    document.querySelector('input[name="medicineName"]').value = name;

    document.querySelector('input[name="medicineTime"]').value = time;

    document.getElementById("submitButton").innerText =
        "Update Medicine";

}


// ================= DELETE MEDICINE =================

async function deleteMedicine(id) {

    if (!confirm("Delete this medicine?")) {
        return;
    }

    await fetch("/deleteMedicine/" + id, {

        method: "DELETE"

    });

    loadMedicines();

}


// ================= ADD / UPDATE =================

document.getElementById("medicineForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const medicineName =
            document.querySelector('input[name="medicineName"]').value;

        const medicineTime =
            document.querySelector('input[name="medicineTime"]').value;


        // UPDATE EXISTING MEDICINE

        if (editingMedicineId) {

            const response = await fetch(
                "/updateMedicine/" + editingMedicineId,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        medicineName: medicineName,
                        medicineTime: medicineTime
                    })
                }
            );


            if (response.ok) {

                alert("Medicine Updated Successfully!");

                editingMedicineId = null;

                document.getElementById("submitButton").innerText =
                    "+ Add Medicine";

                document.getElementById("medicineForm").reset();

                loadMedicines();

            } else {

                alert("Failed to update medicine.");

            }

        }


        // ADD NEW MEDICINE

        else {

            const response = await fetch(
                "/addMedicine",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: new URLSearchParams({
                        medicineName: medicineName,
                        medicineTime: medicineTime
                    })
                }
            );


            if (response.ok) {

                document.getElementById("medicineForm").reset();

                loadMedicines();

            } else {

                alert("Failed to add medicine.");

            }

        }

    }
);


// Load medicines when page opens

loadMedicines();

</script>

</body>

</html>
