<!DOCTYPE html>
<html>

<head>

    <title>Medicine Reminder Dashboard</title>

    <link rel="stylesheet" href="/style.css">

    <style>

        .taken-area {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            margin-right: 10px;
        }

        .taken-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #888;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .taken-checkbox.checked {
            background: #22c55e;
            border-color: #22c55e;
            color: white;
        }

        .taken-label {
            color: #333;
        }

        .taken-label.checked {
            color: #16a34a;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>💊 Medicine Reminder</h1>

    <h2>Manage Your Medicines</h2>

    <form id="medicineForm">

        <label>Medicine Name</label>

        <input
            type="text"
            name="medicineName"
            placeholder="Enter medicine name"
            required
        >

        <label>Reminder Time</label>

        <input
            type="time"
            name="medicineTime"
            required
        >

        <button type="submit" id="submitButton">
            + Add Medicine
        </button>

    </form>

    <hr>

    <h3>Your Medicines</h3>

    <div id="medicineList"></div>

    <button
        class="logout-btn"
        onclick="window.location.href='/login'">

        Logout

    </button>

</div>


<script>

let editingMedicineId = null;


// ================= LOAD MEDICINES =================

async function loadMedicines() {

    const response = await fetch("/getMedicines");

    const medicines = await response.json();

    const list = document.getElementById("medicineList");

    list.innerHTML = "";


    medicines.forEach((medicine) => {

        let time = medicine.medicineTime;

        let [hour, minute] = time.split(":");

        hour = parseInt(hour);

        let period = "AM";


        if (hour >= 12) {
            period = "PM";
        }

        if (hour > 12) {
            hour -= 12;
        }

        if (hour === 0) {
            hour = 12;
        }


        const formattedTime =
            `${hour}:${minute} ${period}`;


        // ================= TAKEN CHECKBOX =================

        let takenHTML;


        if (medicine.taken) {

            takenHTML = `

                <div
                    class="taken-area"
                    onclick="takeMedicine('${medicine._id}')">

                    <div class="taken-checkbox checked">
                        ✓
                    </div>

                    <span class="taken-label checked">
                        Taken
                    </span>

                </div>

            `;

        } else {

            takenHTML = `

                <div
                    class="taken-area"
                    onclick="takeMedicine('${medicine._id}')">

                    <div class="taken-checkbox">
                    </div>

                    <span class="taken-label">
                        Taken
                    </span>

                </div>

            `;

        }


        // ================= MEDICINE CARD =================

        list.innerHTML += `

            <div class="medicine-card">

                <div class="medicine-info">

                    <h4>
                        💊 ${medicine.medicineName}
                    </h4>

                    <p>
                        🕒 ${formattedTime}
                    </p>

                </div>


                <div class="action-buttons">

                    ${takenHTML}


                    <button
                        type="button"
                        class="edit-btn"
                        onclick="editMedicine(
                            '${medicine._id}',
                            '${medicine.medicineName}',
                            '${medicine.medicineTime}'
                        )">

                        Edit

                    </button>


                    <button
                        type="button"
                        class="delete-btn"
                        onclick="deleteMedicine('${medicine._id}')">

                        Delete

                    </button>

                </div>

            </div>

        `;

    });

}


// ================= EDIT MEDICINE =================

function editMedicine(id, name, time) {

    editingMedicineId = id;

    document.querySelector(
        'input[name="medicineName"]'
    ).value = name;

    document.querySelector(
        'input[name="medicineTime"]'
    ).value = time;

    document.getElementById(
        "submitButton"
    ).innerText = "Update Medicine";

}


// ================= DELETE MEDICINE =================

async function deleteMedicine(id) {

    if (!confirm("Delete this medicine?")) {
        return;
    }

    await fetch(
        "/deleteMedicine/" + id,
        {
            method: "DELETE"
        }
    );

    loadMedicines();

}


// ================= MARK AS TAKEN =================

async function takeMedicine(id) {

    const response = await fetch(
        "/takeMedicine/" + id,
        {
            method: "PUT"
        }
    );


    if (response.ok) {

        loadMedicines();

    } else {

        alert(
            "Failed to mark medicine as taken."
        );

    }

}


// ================= ADD / UPDATE =================

document.getElementById(
    "medicineForm"
).addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const medicineName =
            document.querySelector(
                'input[name="medicineName"]'
            ).value;


        const medicineTime =
            document.querySelector(
                'input[name="medicineTime"]'
            ).value;


        // ================= UPDATE =================

        if (editingMedicineId) {

            const response = await fetch(
                "/updateMedicine/" +
                editingMedicineId,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        medicineName:
                            medicineName,

                        medicineTime:
                            medicineTime

                    })

                }
            );


            if (response.ok) {

                alert(
                    "Medicine Updated Successfully!"
                );


                editingMedicineId = null;


                document.getElementById(
                    "submitButton"
                ).innerText =
                    "+ Add Medicine";


                document.getElementById(
                    "medicineForm"
                ).reset();


                loadMedicines();

            } else {

                alert(
                    "Failed to update medicine."
                );

            }

        }


        // ================= ADD =================

        else {

            const response = await fetch(
                "/addMedicine",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/x-www-form-urlencoded"

                    },

                    body: new URLSearchParams({

                        medicineName:
                            medicineName,

                        medicineTime:
                            medicineTime

                    })

                }
            );


            if (response.ok) {

                document.getElementById(
                    "medicineForm"
                ).reset();

                loadMedicines();

            } else {

                alert(
                    "Failed to add medicine."
                );

            }

        }

    }
);


// Load medicines when page opens

loadMedicines();

</script>

</body>

</html>
